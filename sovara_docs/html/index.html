<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SOVARA Docs</title>
<style>
:root{--cy:#13b9f0;--cy2:#0b86b8;--cy3:#073f58;--bg:#050e16;--tx:#eaf6ff;--mu:#7fa0b5;--yl:#b8dd1a;--rd:#d92b2b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font-family:Bahnschrift,Orbitron,"Segoe UI",Arial,sans-serif;color:var(--tx);overflow:hidden}
#root{display:none;position:fixed;inset:0;background:rgba(0,4,8,.6);align-items:center;justify-content:center}
#root.on{display:flex}
.win{position:relative;width:min(1000px,97vw);max-height:95vh;overflow:auto;padding:20px 22px 22px;border-radius:8px;border:1px solid rgba(19,185,240,.28);
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 2px,transparent 2px 9px),radial-gradient(700px 320px at 100% 0%,rgba(19,185,240,.2),transparent 70%),radial-gradient(500px 300px at 0% 100%,rgba(19,185,240,.1),transparent 70%),var(--bg);
 box-shadow:0 0 60px rgba(19,185,240,.18),0 30px 90px rgba(0,0,0,.8);animation:in .3s ease;scrollbar-width:thin;scrollbar-color:#17445a transparent}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(3) rotate(-20deg)}60%{opacity:1;transform:scale(.92) rotate(-8deg)}100%{opacity:.88;transform:scale(1) rotate(-8deg)}}
.chev{position:absolute;left:50%;top:0;width:130px;transform:translateX(-50%);filter:drop-shadow(0 0 8px var(--cy));pointer-events:none}
.edge{position:absolute;left:0;top:44px;width:20px;filter:drop-shadow(0 0 6px var(--cy));pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative}
.hd{display:flex;align-items:center;gap:12px}
.ib{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--cy);border-radius:4px;background:linear-gradient(135deg,#0d5a7c,#06293b);box-shadow:0 0 14px rgba(19,185,240,.35),inset 0 0 10px rgba(19,185,240,.25)}
.ib svg{width:18px;height:18px;fill:#e6f7ff}
.tt{font:800 15px/1.05 Bahnschrift,sans-serif;letter-spacing:1px}
.tt em{display:block;font-style:normal;font-size:20px;color:var(--cy);text-shadow:0 0 12px rgba(19,185,240,.7);letter-spacing:2px}
.tab{margin-left:10px;padding:9px 18px;background:linear-gradient(180deg,#0e2532,#08151e);border:1px solid #17384a;border-radius:3px;font:700 13px Bahnschrift,sans-serif;letter-spacing:1px;text-transform:uppercase}
.info{display:flex;gap:10px;align-items:center;margin:14px 0 16px;color:#cfe6f3;font-size:12px;max-width:520px;line-height:1.4}
.info b{width:16px;height:16px;border-radius:50%;background:var(--cy);color:#04141d;display:grid;place-items:center;font-size:11px;flex:none}
.right{display:flex;gap:8px;align-items:flex-start}
.tiles{display:flex;gap:8px}
.tile{padding:7px 12px;text-align:center;background:linear-gradient(180deg,#0d2230,#08151e);border:1px solid #17384a;border-radius:3px}
.tile b{font-size:15px;color:var(--cy)}.tile small{display:block;font-size:10px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
.x{width:32px;height:32px;border:1px solid #7a1f1f;background:#3a0f0f;color:#ff6b6b;border-radius:3px;cursor:pointer;font-size:14px}
.fillg{display:grid;grid-template-columns:320px 1fr;gap:18px}
@media(max-width:820px){.fillg,.sg{grid-template-columns:1fr!important}.art{display:none}.tiles{display:none}}
.pnl{border:1px solid rgba(19,185,240,.22);border-radius:6px;padding:14px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px),linear-gradient(180deg,rgba(7,28,42,.9),rgba(4,14,22,.95));box-shadow:inset 0 0 40px rgba(19,185,240,.05)}
.art{position:relative;border-radius:6px;min-height:430px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border:1px solid rgba(19,185,240,.3);
 background:repeating-linear-gradient(135deg,rgba(19,185,240,.06) 0 2px,transparent 2px 10px),radial-gradient(circle at 50% 32%,#10405a,#06131c 76%)}
.art svg{width:100%;height:100%;max-height:440px}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(0deg,rgba(2,9,14,.95),transparent);font-size:12px;color:var(--mu)}
.cap b{display:block;font-size:15px;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:9px;border-radius:4px;border:1px solid rgba(19,185,240,.18);
 background:linear-gradient(90deg,rgba(19,185,240,.16),rgba(6,20,30,.92) 70%);box-shadow:inset 0 0 22px rgba(19,185,240,.06)}
.fr:focus-within{border-color:var(--cy);box-shadow:0 0 14px rgba(19,185,240,.3),inset 0 0 22px rgba(19,185,240,.08)}
.fi{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid rgba(19,185,240,.7);border-radius:3px;background:linear-gradient(135deg,#0d6285,#073148);box-shadow:inset 0 0 10px rgba(19,185,240,.3)}
.fi svg{width:17px;height:17px;fill:#e6f7ff}
.fm{flex:1;min-width:0}
.fl{font-size:11px;color:#6f93a8;letter-spacing:.5px}
.fin{width:100%;background:transparent;border:0;outline:0;color:#fff;font:800 14px Bahnschrift,sans-serif;padding:2px 0 0}
.fin::placeholder{color:#4f6c7d;font-weight:500}
.fvv{display:block;font-size:14px;margin:1px 0 4px}
.fv{width:28px;height:28px;flex:none;border-radius:3px;display:grid;place-items:center;font-weight:900;font-size:14px}
.fv.ok{background:var(--yl);color:#25300a;box-shadow:0 0 12px rgba(184,221,26,.5)}
.fv.bad{background:var(--rd);color:#fff;box-shadow:0 0 12px rgba(217,43,43,.55)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.two2 .fr{margin-bottom:9px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;outline:0;margin:6px 0 4px;display:block}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:2px;background:#fff;box-shadow:0 0 8px var(--cy);cursor:pointer}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ch button{flex:1;min-width:70px;background:rgba(19,185,240,.08);border:1px solid rgba(19,185,240,.3);color:#cfe6f3;padding:7px 8px;border-radius:3px;font:700 12px Bahnschrift,sans-serif;cursor:pointer}
.ch button:hover{background:rgba(19,185,240,.18)}.ch button.on{background:linear-gradient(180deg,#0d8fc2,#0a6a92);border-color:#5fd8ff;color:#fff;box-shadow:0 0 10px rgba(19,185,240,.5)}
.pbtn{display:block;width:100%;margin-top:12px;padding:15px;border-radius:3px;border:1px solid #4fd2ff;background:linear-gradient(180deg,#0f97cc,#0a6890);color:#fff;font:800 14px Bahnschrift,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 24px rgba(19,185,240,.45),inset 0 0 14px rgba(255,255,255,.12)}
.pbtn:hover:not(:disabled){filter:brightness(1.15)}
.pbtn:disabled{background:linear-gradient(180deg,#0c3a50,#082636);border-color:#16546f;color:#6f9ab0;box-shadow:none;cursor:not-allowed}
.ghost{width:100%;margin-top:8px;padding:11px;border-radius:3px;border:1px solid #17384a;background:linear-gradient(180deg,#0e2532,#08151e);color:#cfe6f3;font:700 12px Bahnschrift,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.ghost:hover{border-color:var(--cy)}.ghost.red:hover{border-color:var(--rd)}
.sg{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.pad{width:100%;height:150px;display:block;background:#f5f2e9;border-radius:4px;cursor:crosshair;margin-top:6px}
.paper{background:#f5f2e9;color:#1a1a1a;border-radius:5px;padding:22px;font-family:Georgia,serif;font-size:13px;line-height:1.55;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 24px rgba(19,185,240,.15)}
.lh{display:flex;justify-content:space-between;border-bottom:2px solid #1a1a1a;padding-bottom:8px;margin-bottom:10px;font:800 12px sans-serif;letter-spacing:2px}
.paper h2{margin:6px 0 10px;font-size:19px;text-align:center;letter-spacing:3px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}dt{color:#555}dd{margin:0;font-weight:700}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.sig{border-bottom:1px solid #222;height:50px;font-family:"Brush Script MT","Segoe Script",cursive;font-size:25px;color:#0a3a8a;display:flex;align-items:flex-end}
.sig svg{height:48px;width:100%}.sl2{font-size:11px;color:#555;margin-top:2px}
.stamp{position:absolute;right:16px;bottom:78px;border:3px solid #1a8f5c;color:#1a8f5c;padding:3px 12px;border-radius:5px;font:800 13px sans-serif;animation:slam .5s .15s both}
.li{cursor:pointer}.li:hover{border-color:var(--cy)}.li .fm b{font-size:14px}.li small{color:var(--mu)}
</style>
</head>
<body>
<div id="root"><div class="win">
<svg class="chev" viewBox="0 0 120 40" fill="none" stroke="#13b9f0"><path d="M4 4l56 30 56-30" stroke-width="4"/><path d="M22 4l38 21 38-21" stroke-width="3" opacity=".55"/></svg>
<svg class="edge" viewBox="0 0 20 60" fill="none" stroke="#13b9f0" stroke-width="4"><path d="M2 4l14 26L2 56"/><path d="M10 14l8 16-8 16" opacity=".5"/></svg>
<div class="top">
 <div class="hd" style="margin-left:14px"><span class="ib"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/></svg></span><div class="tt">SYSTEM<em>SOVARA</em></div><span class="tab" id="badge"></span></div>
 <div class="right"><div class="tiles" id="tiles"></div><button class="x" id="x" title="Schließen (ESC)">✕</button></div>
</div>
<div class="info" style="margin-left:14px"><b>i</b><span id="lead"></span></div>
<div id="m"></div>
</div></div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=(n,d={})=>fetch(`https://${GetParentResourceName()}/${n}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});

const I={
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>',
 pin:'<path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/>',
 brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><rect x="9" y="3" width="6" height="3"/>',
 clock:'<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5h-2v6l5 3 1-1.7-4-2.3z"/>',
 cup:'<path d="M4 8h13v6a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><rect x="18" y="9" width="3" height="4"/>',
 doc:'<path d="M6 2h9l5 5v15H6z"/>',
 shop:'<path d="M3 9l2-5h14l2 5v2H3zM5 12h14v8H5z"/>',
 pen:'<path d="M3 21l3-1 13-13-2-2L4 18zM18 3l3 3-2 2-3-3z"/>'
};
const ART={
 arbeitsvertrag:`<svg viewBox="0 0 300 420" preserveAspectRatio="xMidYMax meet"><defs><linearGradient id="j" x1="0" x2="1"><stop offset="0" stop-color="#22394b"/><stop offset="1" stop-color="#070d13"/></linearGradient></defs>
 <path d="M10 420L24 272Q36 222 100 208H200Q264 222 276 272L290 420Z" fill="url(#j)"/><path d="M24 272Q36 222 100 208" stroke="#13b9f0" stroke-opacity=".8" stroke-width="2" fill="none"/>
 <path d="M118 208L150 306L182 208Z" fill="#dcedf7"/><path d="M118 208L150 306L96 250ZM182 208L150 306L204 250Z" fill="#0b141c"/><path d="M143 220h14l5 30-12 84-12-84z" fill="#0b4562"/>
 <rect x="132" y="168" width="36" height="44" fill="#a58f7e"/><ellipse cx="150" cy="128" rx="42" ry="52" fill="#b9a18f"/>
 <path d="M108 120Q110 68 150 70Q190 68 192 120Q182 90 150 92Q118 90 108 120Z" fill="#363c44"/>
 <rect x="114" y="120" width="32" height="15" rx="6" fill="#04070a"/><rect x="154" y="120" width="32" height="15" rx="6" fill="#04070a"/><rect x="146" y="124" width="8" height="3" fill="#04070a"/>
 <path d="M134 164Q150 172 166 164" stroke="#6f5a4c" stroke-width="3" fill="none"/><rect x="104" y="248" width="9" height="6" fill="#13b9f0"/></svg>`,
 gewerbe:`<svg viewBox="0 0 300 420" preserveAspectRatio="xMidYMax meet"><path d="M26 196L150 116L274 196Z" fill="#0c2c3f" stroke="#13b9f0" stroke-opacity=".6"/><rect x="38" y="196" width="224" height="14" fill="#123c54"/>
 ${[0,1,2,3,4,5].map(i=>`<rect x="${52+i*38}" y="210" width="18" height="128" fill="#164a66" stroke="#13b9f0" stroke-opacity=".25"/>`).join('')}
 <rect x="28" y="338" width="244" height="18" fill="#123c54"/><rect x="16" y="356" width="268" height="64" fill="#0a2535"/>
 <rect x="148" y="58" width="3" height="60" fill="#13b9f0"/><path d="M151 60h36v22h-36z" fill="#13b9f0" opacity=".75"/><circle cx="150" cy="170" r="13" fill="none" stroke="#13b9f0" stroke-width="3"/></svg>`
};
const C={
 arbeitsvertrag:{badge:'Arbeitsvertrag',title:'ARBEITSVERTRAG',org:'Privatrechtlicher Vertrag',filler:'Arbeitgeber',signer:'Mitarbeiter',stamp:'UNTERSCHRIEBEN',
  f:[{k:'issuer',sec:'Name des Arbeitgebers',lab:'Arbeitgeber',i:'user',ph:'Vor- und Nachname'},
     {k:'signer',sec:'Name des Mitarbeiters',lab:'Mitarbeiter',i:'user',ph:'Vor- und Nachname'},
     {k:'Straße',sec:'Straße',lab:'Straße',i:'pin',ph:'z. B. Musterstraße 12'},
     {k:'Beruf',sec:'Beruf',lab:'Beruf',i:'brief',ph:'z. B. Mechaniker'},
     {k:'Arbeitsstunden',sec:'Arbeitsstunden pro Tag',lab:'Arbeitszeit',i:'clock',t:'range',min:1,max:12,step:1,def:8,u:'Std.'},
     {k:'Pause',sec:'Pause insgesamt',lab:'Pause',i:'cup',t:'range',min:0,max:120,step:5,def:30,u:'Min.'},
     {k:'Beschäftigung',sec:'Teilzeit oder Vollzeit',lab:'Beschäftigung',i:'doc',t:'choice',o:['Vollzeit','Teilzeit']}]},
 gewerbe:{badge:'Gewerbeschein',title:'GEWERBESCHEIN',org:'Stadtverwaltung Sovara',filler:'Stadtverwaltung',signer:'Antragsteller',stamp:'GENEHMIGT',
  f:[{k:'issuer',sec:'Name des Sachbearbeiters',lab:'Sachbearbeiter',i:'user',ph:'Vor- und Nachname'},
     {k:'signer',sec:'Name des Inhabers',lab:'Inhaber',i:'user',ph:'Vor- und Nachname'},
     {k:'Gewerbename',sec:'Name des Gewerbes',lab:'Gewerbe',i:'shop',ph:'z. B. Sovara Autohaus'},
     {k:'Straße',sec:'Straße',lab:'Straße',i:'pin',ph:'z. B. Musterstraße 12'},
     {k:'Art des Gewerbes',sec:'Art des Gewerbes',lab:'Art',i:'brief',t:'choice',o:['Handel','Dienstleistung','Handwerk','Gastronomie']}]}
};
let mode='';
const tiles=a=>$('tiles').innerHTML=a.map(([n,l,id])=>`<div class="tile"><b ${id?`id="${id}"`:''}>${n}</b><small>${l}</small></div>`).join('');
const head=(c,lead)=>{$('badge').textContent=c.badge;$('lead').textContent=lead};

function paper(t,d,sig,stamp){
 const c=C[t];
 const rows=c.f.filter(f=>f.k!=='issuer'&&f.k!=='signer').map(f=>`<dt>${esc(f.lab)}</dt><dd>${esc(d[f.k])}${f.k==='Pause'?' Min.':''}${f.k==='Arbeitsstunden'?' Std.':''}</dd>`).join('');
 const svg=sig?`<svg viewBox="0 0 300 100" preserveAspectRatio="xMidYMid meet"><path d="${esc(sig)}" fill="none" stroke="#0a3a8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`:'';
 return `<div class="paper"><div class="lh"><span>SOVARA ROLEPLAY</span><span>${c.org}</span></div><h2>${c.title}</h2>
 <dl><dt>${c.filler}</dt><dd>${esc(d.issuer)}</dd><dt>${c.signer}</dt><dd>${esc(d.signer)}</dd>${rows}<dt>Nr.</dt><dd>${esc(d.nr||'—')}</dd><dt>Datum</dt><dd>${esc(d.date||new Date().toLocaleDateString('de-DE'))}</dd></dl>
 <div class="sigs"><div><div class="sig">${esc(d.issuer)}</div><div class="sl2">${c.filler}</div></div><div><div class="sig">${svg}</div><div class="sl2">${c.signer}</div></div></div>
 ${stamp?`<div class="stamp">${c.stamp}</div>`:''}</div>`;
}

function fill(t){
 const c=C[t];mode='fill';head(c,'Trage alle Felder aus. Die Person direkt vor dir erhält das Dokument zur Unterschrift.');
 const st={};c.f.forEach(f=>st[f.k]=f.t==='range'?String(f.def):f.t==='choice'?f.o[0]:'');
 const ic=f=>`<span class="fi"><svg viewBox="0 0 24 24">${I[f.i]}</svg></span>`;
 const row=f=>{
  if(f.t==='range')return `<div class="fr" data-f="${f.k}">${ic(f)}<div class="fm"><div class="fl">${f.sec}</div><b class="fvv" data-o="${f.k}"></b><input type="range" data-k="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.def}"></div><span class="fv ok">✓</span></div>`;
  if(f.t==='choice')return `<div class="fr" data-f="${f.k}">${ic(f)}<div class="fm"><div class="fl">${f.sec}</div><div class="ch">${f.o.map(o=>`<button data-c="${f.k}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div><span class="fv ok">✓</span></div>`;
  return `<div class="fr" data-f="${f.k}">${ic(f)}<div class="fm"><div class="fl">${f.sec}</div><input class="fin" data-k="${f.k}" maxlength="60" placeholder="${f.ph}" autocomplete="off"></div><span class="fv bad" data-v="${f.k}">✕</span></div>`;
 };
 const rng=c.f.filter(f=>f.t==='range');let h='',done=false;
 c.f.forEach(f=>{if(f.t==='range'){if(done)return;done=true;h+=`<div class="two2">${rng.map(row).join('')}</div>`;return}h+=row(f)});
 $('m').innerHTML=`<div class="fillg"><div class="art">${ART[t]}<div class="cap"><b id="c1">—</b>${c.filler} <br><b id="c2" style="margin-top:6px">—</b>${c.signer}</div></div>
  <div class="pnl">${h}<button class="pbtn" id="go" disabled>An Person senden</button></div></div>`;
 const paint=r=>{const p=(r.value-r.min)/(r.max-r.min)*100;r.style.background=`linear-gradient(90deg,#13b9f0 ${p}%,#16394b ${p}%)`};
 const mark=()=>document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',st[b.dataset.c]===b.dataset.o));
 const refresh=()=>{let n=0,tot=0;
  c.f.forEach(f=>{
   if(f.t){const o=document.querySelector(`.fvv[data-o="${f.k}"]`);if(o)o.textContent=st[f.k]+' '+f.u;return}
   tot++;const good=st[f.k].trim().length>=2;if(good)n++;
   const v=document.querySelector(`[data-v="${f.k}"]`);v.className='fv '+(good?'ok':'bad');v.textContent=good?'✓':'✕';
  });
  $('tF').textContent=n+'/'+tot;$('go').disabled=n!==tot;mark();
  $('c1').textContent=st.issuer.trim()||'—';$('c2').textContent=st.signer.trim()||'—'};
 tiles([['0/0','Fertig','tF'],['1/3','Schritt']]);
 document.querySelectorAll('input[type=range]').forEach(paint);
 $('m').oninput=e=>{const k=e.target.dataset.k;if(!k)return;st[k]=e.target.value;if(e.target.type==='range')paint(e.target);refresh()};
 $('m').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;st[b.dataset.c]=b.dataset.o;refresh()};
 $('go').onclick=()=>{post('submit',{docType:t,doc:{...st}})};
 refresh();
}

function sign(t,doc){
 const c=C[t];mode='sign';head(c,'Prüfe das Dokument und unterschreibe, wenn alles stimmt.');
 tiles([['1/2','Unterschriften'],['2/3','Schritt']]);
 $('m').innerHTML=`<div class="sg"><div>${paper(t,doc,'',false)}</div>
  <div class="pnl"><div class="fr" style="margin-bottom:6px"><span class="fi"><svg viewBox="0 0 24 24">${I.pen}</svg></span><div class="fm"><div class="fl">Unterschrift</div><b class="fvv" style="margin:0">${c.signer}</b></div></div>
  <canvas class="pad" id="pad"></canvas><button class="ghost" id="clr">Löschen</button><button class="ghost red" id="no">Ablehnen</button>
  <button class="pbtn" id="ok" disabled>Unterschreiben</button></div></div>`;
 const cv=$('pad'),r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;
 const x=cv.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0a3a8a';
 let path='',dr=false,last=null;
 const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 const sc=(a,b)=>[Math.round(a/cv.width*300),Math.round(b/cv.height*100)];
 const upd=()=>{$('ok').disabled=path.length<20};
 cv.onpointerdown=e=>{dr=true;const[a,b]=pt(e);last=[a,b];x.beginPath();x.moveTo(a,b);const[sx,sy]=sc(a,b);if(path.length<5500)path+=`M ${sx} ${sy} `;cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!dr)return;const[a,b]=pt(e);if(Math.hypot(a-last[0],b-last[1])<3)return;last=[a,b];x.lineTo(a,b);x.stroke();
  const[sx,sy]=sc(a,b);if(path.length<5500)path+=`L ${sx} ${sy} `;upd()};
 cv.onpointerup=()=>dr=false;
 $('clr').onclick=()=>{x.clearRect(0,0,cv.width,cv.height);path='';upd()};
 $('ok').onclick=()=>post('signed',{sig:path.trim()});
 $('no').onclick=()=>post('declined');
}

function view(t,doc,sig,back){
 const c=C[t];mode='view';head(c,'Dein Dokument mit allen Unterschriften.');
 tiles([['2/2','Unterschriften'],['3/3','Schritt']]);
 $('m').innerHTML=`<div style="max-width:540px;margin:6px auto">${paper(t,doc,sig,true)}${back?'<button class="ghost" id="bk">← Zurück zur Liste</button>':''}</div>`;
 if(back)$('bk').onclick=back;
}

function list(t,docs){
 const c=C[t];mode='list';head(c,'Wähle das Dokument, das du ansehen möchtest.');
 tiles([[docs.length,'Dokumente']]);
 $('m').innerHTML=`<div class="pnl" style="max-width:560px;margin:6px auto">`+docs.map((r,i)=>`<div class="fr li" data-i="${i}"><span class="fi"><svg viewBox="0 0 24 24">${I.doc}</svg></span><div class="fm"><div class="fl">${c.badge} · ${esc(r.doc.date)}</div><b class="fvv" style="margin:0">${esc(r.doc.issuer)} → ${esc(r.doc.signer)}</b></div><span class="fv ok">✓</span></div>`).join('')+`</div>`;
 document.querySelectorAll('.li').forEach(e=>e.onclick=()=>{const r=docs[e.dataset.i];view(t,r.doc,r.sig,()=>list(t,docs))});
}

window.addEventListener('message',e=>{
 const d=e.data;
 if(d.action==='close'){$('root').classList.remove('on');$('m').innerHTML='';return}
 if(!C[d.docType])return;
 $('root').classList.add('on');
 if(d.action==='fill')fill(d.docType);
 if(d.action==='sign')sign(d.docType,d.doc);
 if(d.action==='view')view(d.docType,d.doc,d.sig);
 if(d.action==='list'){d.docs.length===1?view(d.docType,d.docs[0].doc,d.docs[0].sig):list(d.docType,d.docs)}
});
const closeUi=()=>post(mode==='sign'?'declined':'close');
$('x').onclick=closeUi;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeUi()});
</script>
</body>
</html>
